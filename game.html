<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Rooftop Cat 3D — one prompt, one cat, one game</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #191233;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #game { position: fixed; inset: 0; display: block; touch-action: none; }
  .overlay { position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; color: #fff;
    background: linear-gradient(180deg, rgba(25,18,51,0.25), rgba(25,18,51,0.72));
    z-index: 5; }
  .overlay h1 { margin: 0 0 8px; font-size: clamp(44px, 9vw, 84px); letter-spacing: 2px;
    color: #ffd166; text-shadow: 0 4px 24px rgba(0,0,0,0.6); }
  .overlay h2 { margin: 0 0 6px; font-size: clamp(30px, 6vw, 54px); color: #ffd166; }
  .overlay p { margin: 6px 0; font-size: clamp(16px, 3vw, 22px); color: #f5d0a9; }
  .overlay .dim { color: #cfc4e8; font-size: clamp(14px, 2.4vw, 18px); }
  .overlay button { margin-top: 22px; padding: 14px 42px; font-size: 22px; font-weight: 700;
    color: #191419; background: #ffd166; border: none; border-radius: 999px; cursor: pointer;
    box-shadow: 0 6px 24px rgba(0,0,0,0.45); }
  .overlay button:active { transform: scale(0.96); }
  #mute-btn { position: fixed; top: 14px; right: 14px; z-index: 6; padding: 8px 14px;
    font-size: 13px; font-weight: 700; color: #fff; background: rgba(16,10,34,0.6);
    border: 1px solid rgba(255,255,255,0.35); border-radius: 999px; cursor: pointer; }
  #hint { position: fixed; bottom: 14px; left: 0; right: 0; text-align: center; z-index: 4;
    color: rgba(255,255,255,0.75); font-size: 14px; pointer-events: none;
    text-shadow: 0 1px 6px rgba(0,0,0,0.7); }
</style>
</head>
<body>
<canvas id="game"></canvas>
<button id="mute-btn">SOUND ON</button>
<div id="hint">click · tap · space to jump</div>

<div id="title-screen" class="overlay">
  <h1>ROOFTOP CAT</h1>
  <p>one prompt. one cat. one game.</p>
  <p class="dim">a cat leaps between rooftops at dusk.<br>
  press at the right moment to land on the next roof.<br>
  miss, and you fall. perfect landings build a streak.</p>
  <p class="dim" id="title-best"></p>
  <button id="start-btn">PLAY</button>
  <p class="dim">built from one prompt · three.js · no installs</p>
</div>

<div id="game-over" class="overlay" style="display:none">
  <h2>GAME OVER</h2>
  <p id="over-score">score 0</p>
  <p class="dim" id="over-best">best 0</p>
  <button id="restart-btn">JUMP AGAIN</button>
</div>

<script type="module">
  import { startGame } from './src/main.js';
  startGame(document.getElementById('game'));
</script>
</body>
</html>
